server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: msvc-product
              uri: lb://msvc-product
              predicates:
                - Path=/api/products/**
            - id: msvc-order
              uri: lb://msvc-order
              predicates:
                - Path=/api/orders/**
  
  security:
    oauth2:

      resourceserver:
        jwt:
          issuer-uri: http://keycloak:7080/realms/order-system

  output:
    ansi:
      enabled: ALWAYS
    
  
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.security: DEBUG