server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/orders_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Solo order usa este circuit breaker; la config base (default) vive en application.yml
resilience4j:
  circuitbreaker:
    instances:
      productCB:
        baseConfig: default
        # un producto inexistente es un error de negocio, no un fallo del servicio
        ignoreExceptions:
          - com.osen.msvc_order.exceptions.ProductNotFoundException
